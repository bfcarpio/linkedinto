[tools]
prek = "latest"
python = "3.12"
uv = "latest"
tinytex = "latest"

[settings]
python.uv_venv_auto = "source"

[tasks.clean]
run = "rm -rf dist/ .pytest_cache/ .ruff_cache/ .ty/ __pycache__/ **/__pycache__/ linkedinto.egg-info/ .prek_cache/"
description = "Remove all generated and cache files"

[tasks.test]
run = "uv run pytest"
description = "Run tests quickly (no coverage)"

[tasks.test-coverage]
run = "uv run pytest --cov=linkedinto --cov-report=term-missing --cov-fail-under=80"
description = "Run tests with coverage report (minimum 80%)"

[tasks.coverage-report]
run = "uv run pytest --cov=linkedinto --cov-report=html --cov-report=xml && echo 'Coverage report available at htmlcov/index.html'"
description = "Generate HTML and XML coverage reports"

[tasks.lint]
run = "uv run ruff check src/ tests/"
description = "Run ruff linter"

[tasks.format]
run = "uv run ruff format --respect-gitignore --exclude tests/fixtures/"
description = "Check formatting with ruff"

[tasks.typecheck]
run = "uv run ty check src/ tests/"
description = "Run type checker"

[tasks.render-pdf]
run = """
# Ensure required LaTeX packages are installed (idempotent)
tlmgr install fontawesome6 source-sans-pro-3 roboto parskip hyperref geometry xcolor fontspec unicode-math etoolbox xifthen xstring tabularx enumitem ragged2e fancyhdr ifxetex bookmark tcolorbox 2>/dev/null || true
# Clone Awesome-CV into a temp dir to get awesome-cv.cls and supporting files
tmpdir=$(mktemp -d)
trap 'rm -rf "$tmpdir"' EXIT
git clone --depth 1 https://github.com/posquit0/Awesome-CV.git "$tmpdir/awesomecv"
# Copy rendered .tex files into the clone
cp awesome-cv.tex "$tmpdir/awesomecv/"
# Build the PDF from there
cd "$tmpdir/awesomecv"
xelatex -interaction=nonstopmode awesome-cv.tex
# Move the resulting PDF back to the original directory
cp awesome-cv.pdf "$OLDPWD/"
"""
description = "Compile awesome-cv.tex to PDF using xelatex (clones Awesome-CV repo for .cls and fonts)"
