[tools]
prek = "latest"
python = "3.12"
uv = "latest"
tinytex = "latest"

[settings]
python.uv_venv_auto = "source"

[tasks.clean]
run = "rm -rf dist/ .pytest_cache/ .ruff_cache/ .ty/ __pycache__/ **/__pycache__/ linkedinto.egg-info/ .prek_cache/ resume.json rendercv.yaml rendercv_output/ awesome-cv.tex awesome-cv.cls awesome-cv.log awesome-cv.aux awesome-cv.pdf"
description = "Remove all generated and cache files"

[tasks.test]
run = "uv run pytest"
description = "Run tests quickly (no coverage)"

[tasks.test-coverage]
run = "uv run pytest --cov=linkedinto --cov-report=term-missing --cov-fail-under=80"
description = "Run tests with coverage report (minimum 80%)"

[tasks.coverage-report]
run = "uv run pytest --cov=linkedinto --cov-report=html --cov-report=xml && echo 'Coverage report available at htmlcov/index.html'"
description = "Generate HTML and XML coverage reports"

[tasks.lint]
run = "uv run ruff check src/ tests/ packages/"
description = "Run ruff linter"

[tasks.format]
run = "uv run ruff format --respect-gitignore --exclude tests/fixtures/ src/ tests/ packages/"
description = "Format code with ruff (in-place)"

[tasks.format-check]
run = "uv run ruff format --check --exclude tests/fixtures/ src/ tests/ packages/"
description = "Check formatting with ruff (fails if unformatted)"

[tasks.ci]
run = "uv run ruff check src/ tests/ packages/ && uv run ruff format --check --exclude tests/fixtures/ src/ tests/ packages/ && uv run ty check src/ tests/ packages/ && uv run pytest --cov=linkedinto --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
description = "Run all CI checks (lint, format, typecheck, test with coverage)"


[tasks.typecheck]
run = "uv run ty check src/ tests/ packages/"
description = "Run type checker"

[tasks.render-pdf]
run = """#!/usr/bin/env bash
# Output directory: first arg or current directory
outdir="${1:-.}"
outdir=$(cd "$outdir" && pwd)

# --- Ensure required LaTeX packages are installed (idempotent) ---
tlmgr install fontawesome6 sourcesans roboto parskip hyperref geometry xcolor fontspec unicode-math etoolbox xifthen xstring tabularx enumitem ragged2e fancyhdr ifxetex bookmark tcolorbox accsupp setspace 2>/dev/null || true
# Make Source Sans 3 and Roboto OTFs visible to fontconfig (xelatex resolves fonts by name)
fontotf=$(kpsewhich SourceSans3-Regular.otf 2>/dev/null)
if [ -n "$fontotf" ]; then
  mkdir -p "$HOME/.fonts"
  cp "$(dirname "$fontotf")"/SourceSans3*.otf "$HOME/.fonts/" 2>/dev/null || true
  robotootf=$(kpsewhich Roboto-Regular.otf 2>/dev/null)
  if [ -n "$robotootf" ]; then
    cp "$(dirname "$robotootf")"/Roboto*.otf "$HOME/.fonts/" 2>/dev/null || true
  fi
  fc-cache -f "$HOME/.fonts" 2>/dev/null || true
fi

# --- RenderCV ---
if [ -f "$outdir/rendercv.yaml" ]; then
  echo "Rendering RenderCV..."
  (cd "$outdir" && uv run "rendercv[full]" render rendercv.yaml)
fi

# --- Awesome-CV ---
if [ -f "$outdir/awesome-cv.tex" ]; then
  echo "Rendering Awesome-CV..."
  # Clone Awesome-CV into a temp dir to get awesome-cv.cls and supporting files
  tmpdir=$(mktemp -d)
  trap 'rm -rf "$tmpdir"' EXIT
  git clone --depth 1 https://github.com/posquit0/Awesome-CV.git "$tmpdir/awesomecv"
  # Copy rendered .tex into the clone
  cp "$outdir/awesome-cv.tex" "$tmpdir/awesomecv/"
  cd "$tmpdir/awesomecv"
  # Build the PDF (xelatex may return non-zero on warnings but still produce output)
  xelatex -interaction=nonstopmode awesome-cv.tex || true
  cp awesome-cv.pdf "$outdir/"
fi

if [ ! -f "$outdir/rendercv.yaml" ] && [ ! -f "$outdir/awesome-cv.tex" ]; then
  echo "No rendercv.yaml or awesome-cv.tex found in $outdir" >&2
  exit 1
fi
"""
description = "Compile rendercv.yaml and/or awesome-cv.tex to PDF. Usage: mise run render-pdf [output-dir]"
