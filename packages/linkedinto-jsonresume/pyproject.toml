[project]
name = "linkedinto-jsonresume"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["linkedinto", "pydantic>=2.0"]

[project.entry-points.'linkedinto.converters']
jsonresume = "linkedinto_jsonresume.converter:JsonResumeConverter"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
